name: Build & Package macOS (Universal DMG)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify-macos:
    name: Build, Verify & Package (macOS Universal)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: oasyss-flux-macos

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js (v20)
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: oasyss-flux-macos/package-lock.json

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # ──────────────────────────────────────────────
      #  Stage 1: Core Subsystem, Static Audit & Negative Security Tests
      # ──────────────────────────────────────────────
      - name: Run Security Static Analysis
        run: node scripts/scan-security.js

      - name: Run Core Subsystem Tests
        run: node tests/test-core.js

      - name: Run Negative Security Tests
        run: node tests/test-security-negative.js

      - name: Run Static Bundle & Packaging Audit Tests
        run: node tests/test-static-bundle.js

      # ──────────────────────────────────────────────
      #  Stage 2: Real macOS Hardware & Native Tests
      # ──────────────────────────────────────────────
      - name: Compile Native Swift Helpers (Universal ARM64 + x86_64)
        run: node scripts/compile-helpers.js

      - name: Run Real macOS Permissions (TCC) Query Test
        run: node tests/test-macos-permissions.js

      - name: Run Real macOS Keychain (Security.framework) Test
        run: node tests/test-macos-keychain.js

      # ──────────────────────────────────────────────
      #  Stage 3: Build Universal macOS Application
      # ──────────────────────────────────────────────
      - name: Build Universal macOS Application (.app)
        run: node scripts/build-macos.js --arch=universal

      # ──────────────────────────────────────────────
      #  Stage 4: Verify Artifact & Universal Architecture
      # ──────────────────────────────────────────────
      - name: Verify Application Bundle & Universal Mach-O Architecture
        run: node tests/test-macos-artifact.js "dist/Oasyss Flux-darwin-universal/Oasyss Flux.app"

      # ──────────────────────────────────────────────
      #  Stage 5: Apple Code Signing (Bottom-Up)
      # ──────────────────────────────────────────────
      - name: Code Signing (Apple Developer ID)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            echo "Applying Developer ID signature with Hardened Runtime (bottom-up)..."
            APP_PATH="dist/Oasyss Flux-darwin-universal/Oasyss Flux.app"

            # 1. Sign helper binaries in app bundle
            if [ -d "$APP_PATH/Contents/Resources/app/assets/macos/helpers" ]; then
              find "$APP_PATH/Contents/Resources/app/assets/macos/helpers" -type f -perm +111 -exec \
                codesign --force --options runtime --entitlements assets/macos/entitlements.mac.plist --sign "$APPLE_SIGNING_IDENTITY" {} +
            fi

            # 2. Sign frameworks and dylibs
            if [ -d "$APP_PATH/Contents/Frameworks" ]; then
              find "$APP_PATH/Contents/Frameworks" \( -name "*.framework" -o -name "*.dylib" \) | sort -r | while read -r item; do
                codesign --force --options runtime --sign "$APPLE_SIGNING_IDENTITY" "$item"
              done

              # 3. Sign Helper apps
              find "$APP_PATH/Contents/Frameworks" -name "*.app" | while read -r item; do
                codesign --force --options runtime --entitlements assets/macos/entitlements.mac.plist --sign "$APPLE_SIGNING_IDENTITY" "$item"
              done
            fi

            # 4. Sign main app bundle
            codesign --force --options runtime \
              --entitlements assets/macos/entitlements.mac.plist \
              --sign "$APPLE_SIGNING_IDENTITY" \
              "$APP_PATH"

            echo "Verifying signature integrity..."
            codesign --verify --deep --strict --verbose=2 "$APP_PATH"
            echo "✓ Code signing verified."
          else
            echo "ℹ️ SIGNING STATUS: BLOCKED (Apple Developer ID not configured in repository secrets). Artifact produced is an Unsigned Test Build."
          fi

      # ──────────────────────────────────────────────
      #  Stage 6: Package & Validate DMG
      # ──────────────────────────────────────────────
      - name: Package & Validate Universal DMG
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          chmod +x scripts/package-dmg.sh
          ./scripts/package-dmg.sh

      # ──────────────────────────────────────────────
      #  Stage 7: Notarization Verification
      # ──────────────────────────────────────────────
      - name: Verify Notarization Status
        run: |
          if [ -n "${{ secrets.APPLE_ID }}" ] && [ -n "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" ] && [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "Validating notarization ticket..."
            xcrun stapler validate "dist/Oasyss Flux — macOS Universal.dmg"
            spctl --assess --type open --context context:primary-signature --verbose "dist/Oasyss Flux — macOS Universal.dmg"
            echo "✓ Notarization validated."
          else
            echo "ℹ️ NOTARIZATION STATUS: BLOCKED (Apple Developer / Notary credentials not configured in repository secrets)."
          fi

      # ──────────────────────────────────────────────
      #  Stage 8: Checksum Generation & Artifact Packaging
      # ──────────────────────────────────────────────
      - name: Compress Universal .app for Distribution
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent "Oasyss Flux-darwin-universal/Oasyss Flux.app" "Oasyss Flux — macOS Universal.zip"

      - name: Generate SHA-256 Checksums
        run: |
          cd dist
          shasum -a 256 *.dmg *.zip > SHA256SUMS.txt
          echo "=== Generated Checksums ==="
          cat SHA256SUMS.txt

      - name: Upload DMG, ZIP, SBOM & Checksum Artifacts
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: oasyss-flux-macos-universal-release
          path: |
            oasyss-flux-macos/dist/*.dmg
            oasyss-flux-macos/dist/*.zip
            oasyss-flux-macos/dist/SHA256SUMS.txt
            oasyss-flux-macos/dist/sbom.json
          retention-days: 14
